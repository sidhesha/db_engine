name: Build & Test

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            make
      - name: Configure
        run: cmake -S . -B build -G "MSYS Makefiles"
      - name: Build
        run: cmake --build build
      - name: Test
        run: build/db_engine_test.exe

  build-linux:
    # Real verification that SqlServer's POSIX-socket branch (see
    # include/db_engine/sqlserver.hpp's compat shim) actually builds and
    # passes the full suite, including its socket-based tests -- not an
    # assumption. This is also the platform the web console's backend
    # container is built from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: build/db_engine_test
